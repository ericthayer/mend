[build]
  # Pinned to the repository root. The site's "Base directory" UI build setting
  # is/was `dist`, which cannot exist in a fresh clone (`dist` is gitignored build
  # output), so config resolution failed with "Base directory does not exist".
  # netlify.toml takes precedence over UI build settings, so this pins the base back
  # to the repository root. Keep this key until the UI field is cleared.
  base = "."
  command = "npm run build"
  publish = "dist"

# Non-production deploys inject the Netlify Drawer, which frames app.netlify.com.
# Headers are global per deploy, so the preview CSP is patched after the build
# instead of loosening the production policy in public/_headers.
[context.deploy-preview]
  command = "npm run build && node scripts/allow-netlify-drawer.mjs"

[context.branch-deploy]
  command = "npm run build && node scripts/allow-netlify-drawer.mjs"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200